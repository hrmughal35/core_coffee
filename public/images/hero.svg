<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b1910"/>
      <stop offset="40%" style="stop-color:#3d2819"/>
      <stop offset="70%" style="stop-color:#5f3c28"/>
      <stop offset="100%" style="stop-color:#2b1910"/>
    </linearGradient>
    <linearGradient id="cupShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="50%" style="stop-color:#d4a054"/>
      <stop offset="100%" style="stop-color:#6B4423"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroBg)"/>
  <ellipse cx="960" cy="700" rx="500" ry="120" fill="#d4a054" opacity="0.08" filter="url(#softGlow)"/>
  <g opacity="0.35" transform="translate(760 340)">
    <path d="M200 320 L200 80 Q200 20 260 20 L340 20 Q400 20 400 80 L400 320 L360 380 L240 380 Z" fill="url(#cupShine)" stroke="#d4a054" stroke-width="2"/>
    <ellipse cx="300" cy="80" rx="100" ry="25" fill="none" stroke="#d4a054" stroke-width="2"/>
  </g>
  <circle cx="1400" cy="300" r="200" fill="#d4a054" opacity="0.06"/>
  <circle cx="500" cy="800" r="150" fill="#d4a054" opacity="0.05"/>
</svg>
