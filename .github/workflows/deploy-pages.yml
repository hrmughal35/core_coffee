name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

env:
  GITHUB_PAGES: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build

      - name: Prepare deployment
        id: prepare
        run: |
          if [ -f out/core_coffee/index.html ]; then
            echo "dir=out/core_coffee" >> $GITHUB_OUTPUT
            echo "Deploying out/core_coffee (basePath build)"
          elif [ -f out/index.html ]; then
            echo "dir=out" >> $GITHUB_OUTPUT
            echo "Deploying out (root build)"
          else
            echo "ERROR: No index.html in out/ or out/core_coffee/"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ steps.prepare.outputs.dir }}
          force_orphan: true
